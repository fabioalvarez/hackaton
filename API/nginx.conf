# Punto de entrada común (equivalente local del ALB).
upstream nodoruta {
    # Health check pasivo: tras 1 fallo, la instancia queda fuera 10 s (QA-01).
    server instancia-a:8000 max_fails=1 fail_timeout=10s;
    server instancia-b:8000 max_fails=1 fail_timeout=10s;
}

server {
    listen 8080;

    location / {
        proxy_pass http://nodoruta;

        # Si una instancia falla, se reintenta en la otra: el cliente no ve el
        # error (≥ 99 % de solicitudes exitosas durante la prueba PR-02).
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;

        # Se conserva el header X-Instance-Id que pone cada instancia (RF-05).
    }
}
