[project]
name = "next"
version = "1.0.0"
description = "Next: orders query API (Nodo Ruta)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
next = "next.main:run"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
