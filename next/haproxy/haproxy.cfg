# Load balancer: round robin between the two API instances.
# It probes GET /health on each instance every 5 s; after 2 failures in a row the instance
# is taken out of the rotation (about 10 s), and it comes back after 2 successful probes.

global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog

    timeout connect 1s
    timeout client  5s
    timeout server  3s

    # If an instance refuses the connection, retry the request on the other one.
    retries 1
    option redispatch

# Docker's DNS: names are resolved again if a container is recreated with another IP.
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

frontend web
    bind *:8080
    default_backend api

backend api
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200

    default-server check inter 5s fall 2 rise 2 resolvers docker init-addr libc,none
    server api-1 api-1:8080
    server api-2 api-2:8080
