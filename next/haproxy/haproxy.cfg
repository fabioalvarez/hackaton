# Load balancer: round robin between the API instances.
# It finds them through Docker's DNS (the name `api` points to every replica), so the instances
# that a deployment starts or removes are picked up without changing this file.
# It probes GET /health on each instance every 5 s; after 2 failures in a row the instance
# is taken out of the rotation (about 10 s), and it comes back after 2 successful probes.

global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog

    timeout connect 1s
    timeout client  5s
    timeout server  3s

    # A new instance can be found before it is ready to answer. If a connection fails, the request
    # is retried on another instance, so the client does not see the error.
    retries 3
    option redispatch 1
    retry-on conn-failure empty-response

# Docker's DNS: `api` is resolved again every few seconds.
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

frontend web
    bind *:8080
    default_backend api

backend api
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200

    # 4 slots: 2 replicas, plus 2 more while a deployment runs both versions side by side.
    default-server check inter 5s fastinter 1s fall 2 rise 2 resolvers docker init-addr none
    server-template api 4 api:8080
